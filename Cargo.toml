[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/mta-domain",
  "crates/mta-store",
  "crates/mta-provider",
  "crates/mta-engine",
  "crates/mta-tui",
  "crates/mta-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mojila/multi-machine-ai-orchestrator"
publish = false

[workspace.dependencies]
# Internal crates. Dependency direction (ADR-0001): domain <- store <- engine <- cli,
# provider -> domain only, tui -> domain only.
mta-domain = { version = "0.1.0", path = "crates/mta-domain" }
mta-store = { version = "0.1.0", path = "crates/mta-store" }
mta-provider = { version = "0.1.0", path = "crates/mta-provider" }
mta-engine = { version = "0.1.0", path = "crates/mta-engine" }
mta-tui = { version = "0.1.0", path = "crates/mta-tui" }
mta-cli = { version = "0.1.0", path = "crates/mta-cli" }
mta-testkit = { version = "0.1.0", path = "crates/mta-testkit" }

# Diagnostics stack — pinned exactly (ADR-0002, ADR-0011). `env-filter` is deliberately not
# enabled: the target/level parser is hand-written in mta-cli.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "std",
  "fmt",
  "ansi",
  "json",
  "tracing-log",
] }
tracing-appender = "=0.2.5"

# Terminal. ratatui 0.30 is a facade over pre-1.0 crates; crossterm must match the one
# ratatui-crossterm links (ADR-0002).
ratatui = "=0.30.2"
crossterm = "=0.29.0"

clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.1"

proptest = "1.6"
tempfile = "3.14"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

# Build hygiene profiles (docs/build.md §2).
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
debug = 0
strip = "debuginfo"
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dist]
inherits = "release"
lto = "fat"
