# Budgets for build artifacts and the shipped binary.
# Enforced by scripts/size-report.sh --check in CI. See docs/build.md.
#
# Values are MiB. They were calibrated in M0 against the first real build of this
# workspace (release binary 2.3 MiB, target/ 932 MiB after a dev + all-targets +
# release build) and leave headroom for the M1 stack — tokio, reqwest/rustls,
# sqlx/sqlite, the event store, and the real TUI. Tighten again in M6 before v0.1
# once the binary carries its real feature set; never raise one silently.
#
# The shipped binary budget covers `mta` only: `mta-testkit` is a dev-only member
# (log capture for tests) and never links into it, so it is out of scope here.
# The diagnostics stack (tracing 0.1.44 / tracing-subscriber 0.3.23 with no
# `env-filter` / tracing-appender 0.2.5) is measured in M0 and booked against
# release_mta_mb rather than guessed; see docs/observability.md and ADR-0011.
# `toml_edit` 0.25.17 (MSRV 1.85) is the only addition for the model picker's
# comment-preserving config writes (ADR-0013); it is measured in M6 and is not
# expected to move the binary budget.

[target]
# Whole `target/` directory after a normal dev + test + release build.
total_mb = 3072
# `target/debug` (our crates + deps + test binaries).
dev_mb = 1600
# `target/release`.
release_mb = 600
# `target/debug/incremental` — the first thing to prune, and never cached in CI.
incremental_mb = 800

[binaries]
# Stripped `target/release/mta` (debug info stripped, symbols kept).
release_mta_mb = 20
